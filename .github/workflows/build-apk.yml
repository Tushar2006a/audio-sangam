name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # also lets you press "Run workflow" by hand

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build small APK (shrunk)
        id: small
        continue-on-error: true
        run: gradle assembleRelease --no-daemon -PminifyEnabled=false

      - name: Fallback build (bigger APK, no shrinking)
        if: steps.small.outcome == 'failure'
        run: gradle assembleRelease --no-daemon -PminifyEnabled=false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioOnly-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
